# Optional: local Postgres. SQLite is the default and does not require Docker.
# NOT hardened for a network-accessible production service.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankcore
      POSTGRES_USER: bankcore
      POSTGRES_PASSWORD: local-demo-password-only
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankcore -d bankcore"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      BANKCORE_DATABASE_URL: postgresql+psycopg://bankcore:local-demo-password-only@db:5432/bankcore
      BANKCORE_DEMO_API_KEY: ${BANKCORE_DEMO_API_KEY:-local-demo-key-only}
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
